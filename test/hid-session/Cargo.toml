[package]
name = "one-kvm-hid-session-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
async-trait = { version = "=0.1.92" }
parking_lot = { version = "=0.12.5" }
tokio = { version = "=1.53.1", features = ["sync", "macros", "rt", "time"] }
tracing = { version = "=0.1.44" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
typeshare = { version = "=1.0.5" }
serialport = { version = "=4.10.1", default-features = false }
tempfile = { version = "=3.27.0" }
libc = { version = "=0.2.189" }
nix = { version = "=0.31.3", default-features = false, features = ["fs", "poll"] }

[profile.dev]
debug = 0

# Keep this media-free test crate independent of the application workspace.
[workspace]
